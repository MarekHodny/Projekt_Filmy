<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Knihovna FILMY</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
</head>
<body>

    <header class="pruh">
        <div class="logo">Knihovna <span>FILMY</span></div>
    </header>

    <nav class="menu">
    <input type="text" id="filterNazev" placeholder="Hledat název" oninput="nactiFilmy()" style="width: 100px;">
    <input type="text" id="filterZanr" placeholder="Žánr" oninput="nactiFilmy()" style="width: 100px;">
    <input type="number" id="filterRok" placeholder="Rok vydání" oninput="nactiFilmy()" style="width: 100px;">
    
    

    <button onclick="ukazForm('add')">Přidat film</button>
</nav>

    <section id="form-sekce">
        <h3 id="form-nadpis">Nový film</h3>
        <form id="film-form" method="POST">
            <input type="text" name="nazev" id="f-nazev" placeholder="Název" required><br>
            <input type="text" name="rok" id="f-rok" placeholder="Rok" required ><br>
            <input type="text" name="zanr" id="f-zanr" placeholder="Žánr" required ><br>
            <input type="text" name="url" id="f-url" placeholder="URL adresa obrázku"><br>

            <div style="margin-top: 10px;">
                <button id="potvrdit" type="submit" >Uložit</button>
                <button id="zrusit" type="button" onclick="zavriForm()" style="padding: 10px; cursor:pointer;">Zrušit</button>
            </div>
        </form>
    </section>

    <div id="detail-modal" class="modal" style="display:none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8);">
    <div style="background-color: #fff; margin: 5% auto; padding: 20px; width: 80%; max-width: 600px; border-radius: 8px; position: relative;">
        <span onclick="zavriDetail()" style="position: absolute; right: 20px; top: 10px; font-size: 28px; cursor: pointer;">&times;</span>
        <div id="detail-obsah">
            </div>
    </div>
</div>

    <main class="prehled" id="seznamFilmu"></main>

    <script>

    async function nactiFilmy() {
    const nazev = document.getElementById('filterNazev').value;
    const zanr = document.getElementById('filterZanr').value;
    const rok = document.getElementById('filterRok').value;
    
    
   
    const params = new URLSearchParams({
        search: nazev,
        zanr: zanr,
        rok: rok
    }); 


    const res = await fetch(`/items?${params.toString()}`);
    const filmy = await res.json();

   
    const div = document.getElementById('seznamFilmu');
    div.innerHTML = '';

    filmy.forEach(f => {

        const fotoHTML = f.url 
        ? `<img src="${f.url}" style="width:100%; height:100%; object-fit:cover;">`
        : `<span class="material-symbols-outlined" style="font-size: 50px; color: #bbb;">movie</span>`;

        div.innerHTML += `
            <div class="karta">
                    <div class="obrazekKarta">${fotoHTML}</div>
                    <div class="obsah-karty">
                        <h2 onclick="ukazDetail(${f.id})" style="cursor:pointer; color: #2196F3; text-decoration: underline;">${f.nazev}</h2>
                        <div class="film-info">
                            <div><strong>Rok:</strong> ${f.rok}</div>
                            <div><strong>Žánr:</strong> ${f.zanr}</div>
                        </div>
                        <div class="film-id">ID: ${f.id}</div>
                    </div>
                    <div class="ikony-bar">
                        <button onclick="pripravEdit(${f.id})" class="btn-icon">
                            <span class="material-symbols-outlined">edit</span> Upravit
                        </button>
                        <button onclick="smazFilm(${f.id})" class="btn-icon del">
                            <span class="material-symbols-outlined">delete</span> Smazat
                        </button>
                    </div>
                </div>`;

        
    }); 
}
        function ukazForm(typ) {
            document.getElementById('form-sekce').style.display = 'block';
            if(typ === 'add') {
                document.getElementById('film-form').reset();
                document.getElementById('film-form').action = "/items";
                document.getElementById('form-nadpis').innerText = "Nový film";
            }
        }

        async function pripravEdit(id) {
            const res = await fetch(`/get-film/${id}`);
            const f = await res.json();
            ukazForm('edit');
            document.getElementById('form-nadpis').innerText = "Upravit film";
            document.getElementById('f-nazev').value = f.nazev;
            document.getElementById('f-rok').value = f.rok;
            document.getElementById('f-zanr').value = f.zanr;
            document.getElementById('f-url').value = f.url || "";
            document.getElementById('film-form').action = `/edit/${id}`;
            window.scrollTo(0,0);
        }

        async function smazFilm(id) {
        if (!confirm('Opravdu smazat tento film?')) return;

        const res = await fetch(`/delete/${id}`, {
            method: 'DELETE'
        });

        if (res.ok) {
            nactiFilmy(); 
        } else {
            alert('Chyba při mazání filmu.');
        }
    }

    async function ukazDetail(id) {
    const res = await fetch(`/get-film/${id}`);
    const f = await res.json();
    
    const obsah = document.getElementById('detail-obsah');
    const foto = f.url 
        ? `<img src="${f.url}" style="width:100%; max-height:400px; object-fit:contain; margin-bottom:15px;">` 
        : `<div style="text-align:center; padding:40px; background:#eee;"><span class="material-symbols-outlined" style="font-size: 100px;">movie</span></div>`;

    obsah.innerHTML = `
        ${foto}
        <h1 style="margin-top:0;">${f.nazev}</h1>
        <hr>
        <p><strong>Rok vydání:</strong> ${f.rok}</p>
        <p><strong>Žánr:</strong> ${f.zanr}</p>
        <p><strong>ID filmu:</strong> ${f.id}</p>`;
    
    document.getElementById('detail-modal').style.display = 'block';
}

function zavriDetail() {
    document.getElementById('detail-modal').style.display = 'none';
}

window.onclick = function(event) {
    const modal = document.getElementById('detail-modal');
    if (event.target == modal) {
        zavriDetail();
    }
}

        function zavriForm() { document.getElementById('form-sekce').style.display = 'none'; }
        
        nactiFilmy();
    </script>
</body>
</html>
